[package]
name = "potions"
version = "0.0.3"
edition = "2021"

[lib]
name = "core"
crate-type = ["cdylib"]

[features]
# Extension builds (maturin, per pyproject.toml) enable this; `cargo test`
# runs without it so the test binary links against libpython (PyO3 book,
# FAQ "I can't run cargo test").
extension-module = ["pyo3/extension-module"]

[dependencies]
faer = "0.24.4"
numpy = "0.27.0"
polars = {version="0.53.0", features=["ndarray"]}
pyo3 = { version = "0.27", features = ["generate-import-lib"]}
pyo3-polars = "0.26.0"
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.149"
serde_yaml = "0.9"
uom = {version="0.38.0", features=["serde"]}

[dev-dependencies]
# Test-only: lets `cargo test` initialize the interpreter on demand so
# pyo3 types that touch the GIL (e.g. `PyError` creation on the panic
# path) don't abort the test binary.  Dev-deps never unify into the
# extension build, which keeps `extension-module` (no libpython link).
pyo3 = { version = "0.27", features = ["auto-initialize"] }

[profile.release]
debug = 1
