name: Compile Cross-Platform Wheels

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # setup-python is used for native Windows and macOS builds.
      # Linux runs inside a manylinux container, so its Python
      # interpreter is selected in the maturin arguments instead.
      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: "2_28"
          rust-toolchain: stable
          sccache: true
          args: >-
            --release
            --locked
            --out dist
            --interpreter python${{ matrix.python-version }}

      - name: Build Windows or macOS wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          sccache: true
          args: >-
            --release
            --locked
            --out dist
            --interpreter python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          rust-toolchain: stable
          args: >-
            --locked
            --out dist

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-wheels
      - build-sdist

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/YOUR-PACKAGE-NAME/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Show distributions
        run: ls -la dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
